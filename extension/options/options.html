<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>AI知見要約 — 設定</title>
  <style>
    body {
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      max-width: 560px;
      margin: 48px auto;
      padding: 0 16px;
      color: #0f1419;
      line-height: 1.6;
    }
    h1 { font-size: 20px; }
    label { display: block; font-weight: 700; margin: 20px 0 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #cfd9de;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .hint { font-size: 12px; color: #536471; margin-top: 4px; }
    button {
      margin-top: 24px;
      padding: 10px 28px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: #1d9bf0;
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }
    #status { margin-left: 12px; color: #00ba7c; font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      body { background: #15202b; color: #e7e9ea; }
      input { background: #1e2732; color: #e7e9ea; border-color: #38444d; }
      .hint { color: #8b98a5; }
    }
  </style>
</head>
<body>
  <h1>AI知見要約 — 設定</h1>

  <label for="apiKey">Claude APIキー</label>
  <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" />
  <p class="hint">
    console.anthropic.com で発行。この端末の chrome.storage.local にのみ保存され、外部には送信されません
    (要約時に api.anthropic.com へ直接送られる以外)。
  </p>

  <label for="model">モデル</label>
  <input id="model" type="text" placeholder="claude-sonnet-4-6" />
  <p class="hint">空欄なら claude-sonnet-4-6 を使用。</p>

  <button id="save" type="button">保存</button><span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
